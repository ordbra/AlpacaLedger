<button id="test">Probar TradingView</button>
<pre id="result"></pre>

<img
  src="https://finviz.com/chart.ashx?t=NVDA&ty=c&ta=1&p=d"
  onload="console.log('Finviz OK')"
  onerror="console.log('Finviz ERROR')">

<img
  loading="lazy"
  src="https://finviz.com/chart.ashx?t=NVDA&ty=c&ta=1&p=d">

<script>
document.getElementById("test").onclick = async () => {
    const result = document.getElementById("result");

    try {
        const response = await fetch(
            "https://es.tradingview.com/watchlists/322136423/"
        );

        const html = await response.text();

        result.textContent =
            `OK\nHTTP: ${response.status}\nBytes: ${html.length}`;
    }
    catch (error) {
        result.textContent =
            `ERROR\n${error}`;
    }
};
</script>

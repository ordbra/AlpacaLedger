<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba Finviz</title>
</head>

<body>

<h2>Prueba Finviz</h2>

<img
    id="finvizImage"
    src="https://finviz.com/chart.ashx?t=NVDA&ty=c&ta=1&p=d"
    alt="Gráfico Finviz">

<br><br>

<button id="testCanvas">
    Probar canvas
</button>

<button id="copyButton">
    Copiar
</button>

<pre id="status"></pre>

<canvas id="canvas" style="display:none"></canvas>

<script>

const image = document.getElementById("finvizImage");
const canvas = document.getElementById("canvas");
const status = document.getElementById("status");

image.onload = () => {
    status.textContent =
        "IMAGEN CARGADA\n" +
        `Tamaño: ${image.naturalWidth} x ${image.naturalHeight}`;
};

image.onerror = () => {
    status.textContent = "ERROR: La imagen no pudo cargarse.";
};

document.getElementById("testCanvas").onclick = () => {

    try {

        if (!image.complete || image.naturalWidth === 0) {
            throw new Error("La imagen no está cargada.");
        }

        canvas.width = image.naturalWidth;
        canvas.height = image.naturalHeight;

        const ctx = canvas.getContext("2d");

        ctx.drawImage(image, 0, 0);

        const url = canvas.toDataURL("image/png");

        status.textContent =
            "CANVAS OK\n" +
            `Imagen generada: ${url.length} caracteres`;

    }
    catch (error) {

        status.textContent =
            "CANVAS BLOQUEADO\n\n" +
            error.name + "\n" +
            error.message;

        console.error(error);
    }

};

document.getElementById("copyButton").onclick = async () => {

    try {

        if (!image.complete || image.naturalWidth === 0) {
            throw new Error("La imagen no está cargada.");
        }

        canvas.width = image.naturalWidth;
        canvas.height = image.naturalHeight;

        const ctx = canvas.getContext("2d");

        ctx.drawImage(image, 0, 0);

        const blob = await new Promise((resolve, reject) => {

            canvas.toBlob(result => {

                if (result)
                    resolve(result);
                else
                    reject(new Error("No se pudo generar el PNG."));

            }, "image/png");

        });

        await navigator.clipboard.write([
            new ClipboardItem({
                "image/png": blob
            })
        ]);

        status.textContent =
            "COPIADO CORRECTAMENTE";

    }
    catch (error) {

        status.textContent =
            "ERROR AL COPIAR\n\n" +
            error.name + "\n" +
            error.message;

        console.error(error);
    }

};

</script>

</body>
</html>
